<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c241c">
  <title>Fern — ติวสอบตำรวจ สายอำนวยการ | Thai Police Exam Prep</title>
  <link rel="icon" type="image/png" href="assets/icons/favicon-64.png">
  <link rel="stylesheet" href="web/mascot.css">
  <link rel="stylesheet" href="fern.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
  <script src="fern-ui.js" defer></script>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <picture>
      <source media="(prefers-reduced-motion: reduce)" srcset="assets/loading/mascota-cargando-estatica.png">
      <source type="image/webp" srcset="assets/loading/mascota-cargando.webp">
      <img src="assets/loading/mascota-cargando.gif" alt="" width="360" height="360" fetchpriority="high">
    </picture>
    <span data-i18n="loadingLabel">กำลังโหลด…</span>
  </div>

  <header class="topbar">
    <div class="hud">
      <button type="button" class="logo" onclick="go('home')" aria-label="Fern">
        Fern<span class="logo-period" aria-hidden="true">.</span>
      </button>
      <div class="langtog" role="group" aria-label="Language / ภาษา">
        <button type="button" id="lang-th" class="on" lang="th" aria-pressed="true">ไทย</button>
        <button type="button" id="lang-en" lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main class="wrap" id="main">
    <section class="view on" id="v-home" aria-labelledby="home-title">
      <section class="hero" aria-labelledby="home-title">
        <div class="hero-art">
          <img
            src="assets/hero/fern-reading-960.webp"
            srcset="assets/hero/fern-reading-640.webp 640w, assets/hero/fern-reading-960.webp 960w, assets/hero/fern-reading-1254.webp 1254w"
            sizes="(max-width: 760px) 100vw, 520px"
            width="1254"
            height="1254"
            alt=""
            fetchpriority="high"
            decoding="async"
          >
        </div>
        <div class="hero-text">
          <p class="kicker" id="next-lesson-label">บทเรียนถัดไป</p>
          <h1 id="home-title" tabindex="-1"></h1>
          <p class="hero-note" id="next-lesson-position"></p>
          <button type="button" class="btn primary" id="resume-lesson" data-i18n="continuePath">เริ่มเรียน</button>
        </div>
      </section>

      <div class="home-actions">
        <button class="home-row" type="button" onclick="startDaily()"><span data-i18n="dailyBtn">ชาเลนจ์วันนี้</span></button>
        <button class="home-row" type="button" onclick="startMistakes()"><span data-i18n="mistakeBtn">ทบทวนข้อที่ผิด</span><span class="quiet-count" id="mistake-n">0</span></button>
        <details class="study-disclosure">
          <summary class="home-row"><span data-i18n="pathTitle">เส้นทางการเรียน</span></summary>
          <div class="study-content">
            <div class="path" id="path"></div>
            <button class="text-action" type="button" onclick="go('mock')" data-i18n="mockShort">สอบจำลอง</button>
          </div>
        </details>
      </div>

      <section class="today" aria-labelledby="today-title">
        <div class="today-head">
          <h2 id="today-title" data-i18n="dailyGoal">เป้าหมายวันนี้</h2>
          <output id="goal-txt">0 / 30 XP</output>
        </div>
        <progress id="goal-progress" max="30" value="0" aria-labelledby="today-title" aria-valuetext="0 / 30 XP"></progress>
      </section>
    </section>

    <section class="view inner-view" id="v-learn" aria-labelledby="learn-title">
      <div class="screen-heading">
        <div><h1 id="learn-title" tabindex="-1" data-i18n="learnTitle">บทเรียน</h1><p class="mut" data-i18n="learnSub">บทเรียนสั้นทั้ง 6 วิชา</p></div>
        <span id="learn-mascot" class="screen-mascot"></span>
      </div>
      <div id="learn-list"></div>
    </section>

    <section class="view inner-view" id="v-quiz" aria-label="Practice / ฝึกข้อสอบ">
      <div id="quiz-menu">
        <div class="screen-heading">
          <div><h1 tabindex="-1" data-i18n="quizTitle">ฝึกข้อสอบ</h1><p class="mut" data-i18n="quizSub"></p></div>
          <span id="practice-mascot" class="screen-mascot"></span>
        </div>
        <div class="utility-list">
          <button class="utility-row" type="button" onclick="startDaily()"><b data-i18n="dailyBtn">ชาเลนจ์วันนี้</b><span class="mut">10 <span data-i18n="qs">ข้อ</span></span></button>
          <button class="utility-row" type="button" onclick="startMistakes()"><b data-i18n="mistakeBtn">ทบทวนข้อที่ผิด</b><span class="quiet-count" id="mistake-n2">0</span></button>
          <button class="utility-row" type="button" onclick="startExtra()"><span><b data-i18n="extraTitle">แบบฝึกพิเศษ</b><small data-i18n="extraSub"></small></span></button>
          <button class="utility-row" type="button" onclick="go('mock')"><b data-i18n="mockShort">สอบจำลอง</b><span class="mut">150 <span data-i18n="qs">ข้อ</span></span></button>
        </div>
        <h2 class="subheading" data-i18n="practiceBySubject">ฝึกตามวิชา</h2>
        <div id="quiz-list"></div>
      </div>
      <div id="quiz-box"></div>
    </section>

    <section class="view inner-view" id="v-cards" aria-labelledby="cards-title">
      <div class="screen-heading">
        <div><h1 id="cards-title" tabindex="-1" data-i18n="cardsTitle">แฟลชการ์ด</h1><p class="mut" data-i18n="cardsSub"></p></div>
        <span id="cards-mascot" class="screen-mascot"></span>
      </div>
      <div id="fc-box"></div>
    </section>

    <section class="view inner-view" id="v-mock" aria-labelledby="mock-title">
      <div id="mock-intro">
        <button class="text-action back-link" type="button" onclick="go('home')" data-i18n="backHome">กลับสู่เส้นทาง</button>
        <div class="screen-heading">
          <div><h1 id="mock-title" tabindex="-1" data-i18n="mockTitle">สอบจำลองเต็มรูปแบบ</h1><p class="mut">150 <span data-i18n="qs">ข้อ</span> · 180 <span data-i18n="mins">นาที</span></p></div>
          <span id="mock-mascot" class="screen-mascot"></span>
        </div>
        <div class="readable">
          <p data-i18n="mockMix"></p>
          <p class="hl" data-i18n="mockRule"></p>
          <div id="mock-history"></div>
          <button class="btn primary" type="button" onclick="startMock()" data-i18n="mockStart">เริ่มสอบจำลอง</button>
        </div>
      </div>
      <div id="mock-box"></div>
    </section>

    <section class="view inner-view" id="v-more" aria-labelledby="more-title">
      <div id="profile-head"></div>
      <div id="more-body"></div>
      <details class="plain-details">
        <summary data-i18n="rulesTitle">กติกาสอบจริง</summary>
        <p><b>150 <span data-i18n="qs">ข้อ</span> · 3 <span data-i18n="hours2">ชั่วโมง</span> · <span data-i18n="mcq">ปรนัย 4 ตัวเลือก</span></b></p>
        <p><span data-i18n="part1">ภาคทั่วไป</span> 40 <span data-i18n="qs">ข้อ</span> · <span data-i18n="part2">ภาคเฉพาะตำแหน่ง</span> 110 <span data-i18n="qs">ข้อ</span></p>
        <p class="hl" data-i18n="passRule"></p><p class="mut" data-i18n="round2note"></p>
      </details>
      <details class="plain-details">
        <summary data-i18n="badges">เหรียญความสำเร็จ</summary>
        <div id="badges"></div>
      </details>
    </section>
  </main>

  <nav class="tabs" aria-label="Navigation / เมนูหลัก">
    <div class="in">
      <button type="button" class="on" data-go="home" aria-current="page"><span class="nav-icon route-icon" aria-hidden="true"></span><span data-i18n="tabHome">เส้นทาง</span></button>
      <button type="button" data-go="learn"><span class="nav-icon learn-icon" aria-hidden="true"></span><span data-i18n="tabLearn">บทเรียน</span></button>
      <button type="button" data-go="quiz"><span class="nav-icon quiz-icon" aria-hidden="true"></span><span data-i18n="tabQuiz">ฝึกข้อสอบ</span></button>
      <button type="button" data-go="cards"><span class="nav-icon cards-icon" aria-hidden="true"></span><span data-i18n="tabCards">การ์ดจำ</span></button>
      <button type="button" data-go="more"><span class="nav-icon profile-icon" aria-hidden="true"></span><span data-i18n="tabMore">แผน</span></button>
    </div>
  </nav>
  <div id="fx" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript><p>เปิดใช้ JavaScript เพื่อเริ่มเรียน · Enable JavaScript to use Fern.</p></noscript>
</body>
</html>
